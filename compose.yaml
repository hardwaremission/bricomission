# BricoMission local stack: core data services (infra-compose-core), Keycloak with
# realm BricoMission (keycloak-realm-roles) and the NestJS API (api-skeleton), built
# from apps/api/Dockerfile and the Next.js PWA (web-pwa-shell) from apps/web/Dockerfile.
# Six core services: postgres, minio, mailpit, keycloak, api, web.
# Start with: docker compose up -d --build --wait   (or ./init.sh)
# Browser E2E (profile e2e, never started by ./init.sh): pnpm test:e2e
# Local AI services (feature local-ai-gpu-spike) are opt-in, never started by ./init.sh:
#   docker compose --profile ai-fetch run --rm ai-fetch   # one-time weight download into volumes
#   docker compose --profile ai up -d --wait               # llama-server + comfyui on the GPU
#   docker compose --profile ai stop llama-server comfyui  # name services; bare stop/down also stops the core stack
# Catalog RAG embedder (feature catalog-rag-ingestion, ADR 0004) is opt-in and CPU-only:
#   docker compose --profile rag-fetch run --rm embedder-fetch  # one-time embedding weight download
#   docker compose --profile rag up -d --wait embedder          # CPU embedder (no GPU devices)
#   docker compose --profile rag stop embedder                  # name the service
# No top-level `name:` so COMPOSE_PROJECT_NAME can isolate parallel worktrees.
# Every variable has a default equal to .env.example; the stack runs without a .env.
# Host ports bind to 127.0.0.1 only and are overridable through env vars.

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bricomission}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bricomission}
      POSTGRES_DB: ${POSTGRES_DB:-bricomission}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  minio:
    # Pigsty-maintained community fork (AGPLv3): upstream minio/minio is no longer pullable.
    # Run unmodified as a separate service, used over S3 only. See docs/risks-and-open-questions.md.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-bricomission}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-bricomission-dev-secret}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      # The image ships /usr/bin/curl (confirmed at runtime 2026-11-12) and mc (symlink to mcli).
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.33.1
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: ${MP_MAX_MESSAGES:-5000}
      MP_DATABASE: /data/mailpit.db
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  keycloak:
    # Pinned upstream quay.io/keycloak/keycloak:26.8.2 plus the email-OTP provider jar and the
    # bricomission login/email theme
    # (see infra/keycloak/Dockerfile). Realm BricoMission is imported from the versioned
    # JSON on first start; later starts skip it (IGNORE_EXISTING) and keep the volume state.
    build:
      context: ./infra/keycloak
    image: bricomission/keycloak:26.8.2-emailotp26.7.2-theme1
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    depends_on:
      mailpit:
        condition: service_healthy
    environment:
      # dev-file (H2) persistence: local-only, isolated per worktree, no shared-DB bootstrap.
      KC_DB: dev-file
      KC_HEALTH_ENABLED: "true"
      # Fixed issuer for every caller (browser, CLI, API); the api container still
      # reaches Keycloak over the backchannel at http://keycloak:8080.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-bricomission-kc-admin}
      # Substituted into the ${BM_SEED_*} placeholders of the realm import file.
      BM_SEED_ADMIN_PASSWORD: ${BM_SEED_ADMIN_PASSWORD:-bm-admin-dev}
      BM_SEED_HOMEOWNER_PASSWORD: ${BM_SEED_HOMEOWNER_PASSWORD:-bm-homeowner-dev}
      BM_SEED_PROFESSIONAL_PASSWORD: ${BM_SEED_PROFESSIONAL_PASSWORD:-bm-professional-dev}
      # Web BFF client bricomission-web (homeowner-password-login): its redirect/base URLs and secret.
      BM_WEB_PUBLIC_URL: http://localhost:${WEB_PORT:-3100}
      BM_WEB_CLIENT_SECRET: ${BM_WEB_CLIENT_SECRET:-bm-web-dev-secret}
    ports:
      # Management port 9000 stays internal (it would clash with MinIO on the host).
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./infra/keycloak/import:/opt/keycloak/data/import:ro
      - keycloak-data:/opt/keycloak/data/h2
    healthcheck:
      # The image has no curl: raw HTTP over bash /dev/tcp to the management port.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 120s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-bricomission}:${POSTGRES_PASSWORD:-bricomission}@postgres:5432/${POSTGRES_DB:-bricomission}?schema=public
      # JWT validation (src/auth). No depends_on keycloak: /health must not need it;
      # the JWKS is fetched lazily on the first authenticated request.
      KEYCLOAK_ISSUER: http://localhost:${KEYCLOAK_PORT:-8180}/realms/BricoMission
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/BricoMission/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: bricomission-api
      # AI layer (gpu-job-broker). fake = deterministic adapters, no GPU calls.
      AI_ADAPTERS: ${AI_ADAPTERS:-fake}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://llama-server:8080}
      COMFYUI_BASE_URL: ${COMFYUI_BASE_URL:-http://comfyui:8188}
      GPU_BROKER_DEBUG_ENDPOINTS: ${GPU_BROKER_DEBUG_ENDPOINTS:-false}
      GPU_BROKER_LLM_CONCURRENCY: ${GPU_BROKER_LLM_CONCURRENCY:-1}
      GPU_BROKER_MAX_QUEUED: ${GPU_BROKER_MAX_QUEUED:-20}
      # Catalog RAG (ADR 0004). No depends_on: the embedder is opt-in (profile rag);
      # /catalog/search answers 503 while it is down.
      EMBEDDING_URL: http://embedder:8080
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding-0.6b-q8_0}
      # Qwen3-Embedding query prefix (documents are embedded raw). The API turns the
      # literal "\n" into a newline. Set EMBEDDING_QUERY_INSTRUCTION= (empty) for bge-m3.
      EMBEDDING_QUERY_INSTRUCTION: '${EMBEDDING_QUERY_INSTRUCTION-Instruct: Given a product search query, retrieve catalog passages that contain matching products\nQuery: }'
      # Kitchen capture drafts (kitchen-capture-draft). Photos go to a private MinIO bucket that
      # the API creates on first use. No depends_on minio: the API boots without it and photo
      # uploads answer 503 storage_unavailable. Root credentials for now (dedicated key and
      # Admin-edited settings arrive with admin-service-endpoints).
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-bricomission}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-bricomission-dev-secret}
      S3_BUCKET: ${S3_BUCKET:-bricomission-media}
      DRAFT_TTL_DAYS: ${DRAFT_TTL_DAYS:-7}
      DRAFT_CLEANUP_INTERVAL_MS: ${DRAFT_CLEANUP_INTERVAL_MS:-3600000}
      DRAFT_MAX_OPEN: ${DRAFT_MAX_OPEN:-2000}
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  web:
    # Next.js standalone server (apps/web). Browsers call /api/* on this origin; the
    # route handler proxies to API_INTERNAL_URL (no CORS). No depends_on: Home shows the
    # API state itself (offline/degraded) and works anonymously with postgres or Keycloak down.
    # Sign-in (homeowner-password-login): the server is the OIDC client bricomission-web
    # (BFF); sessions live in the web-owned schema web_session of the same database.
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:3000
      # Every query is schema-qualified (web_session.*); Prisma (api) owns public.
      WEB_DATABASE_URL: postgresql://${POSTGRES_USER:-bricomission}:${POSTGRES_PASSWORD:-bricomission}@postgres:5432/${POSTGRES_DB:-bricomission}
      WEB_PUBLIC_URL: http://localhost:${WEB_PORT:-3100}
      KEYCLOAK_PUBLIC_URL: http://localhost:${KEYCLOAK_PORT:-8180}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_WEB_CLIENT_SECRET: ${BM_WEB_CLIENT_SECRET:-bm-web-dev-secret}
      # AES-256-GCM key for tokens at rest (base64, 32 bytes). Dev default: local use only.
      WEB_SESSION_KEY: ${WEB_SESSION_KEY:-SmSKlZZ67zH0iPvgrQkG8MuWdgcXgBOojZ2sFimNMvE=}
    ports:
      - "127.0.0.1:${WEB_PORT:-3100}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/manifest.webmanifest').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  web-e2e:
    # Pinned Playwright image (Chromium for E2E, Lighthouse and icon rendering); no host
    # browsers needed. Digest (2026-11-13):
    # sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
    # Host network: installability needs the page on a localhost secure context.
    image: mcr.microsoft.com/playwright:v1.65.0-noble
    profiles: ["e2e"]
    restart: "no"
    network_mode: host
    ipc: host
    working_dir: /repo/apps/web
    environment:
      HOME: /tmp
      CI: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - .:/repo

  # --- Local AI (profile "ai"; see docs/spikes/local-ai-gpu-spike.md) ---
  llama-server:
    # Backend chosen by measurement (2026-11-12): ROCm. The Vulkan image
    # ghcr.io/ggml-org/llama.cpp:server-vulkan-b12316 also works on RADV but has half
    # the prompt speed (358 vs 757 tok/s; generation 24.1 vs 24.6 tok/s).
    image: ghcr.io/ggml-org/llama.cpp:server-rocm-b12316
    profiles: ["ai"]
    restart: unless-stopped
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - "${RENDER_GID:-987}"
    command:
      - -m
      - /models/Qwen3-30B-A3B-Instruct-2507-Q4_K_M.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -ngl
      - "99"
      - --n-cpu-moe
      - "${LLAMA_N_CPU_MOE:-48}"
      - -c
      - "${LLAMA_CTX_SIZE:-16384}"
      - -fa
      - "on"
      - --jinja
      - -t
      - "16"
      # Verbosity 4 prints the device and layer-offload lines (load_tensors, KV buffer).
      - -lv
      - "4"
    ports:
      - "127.0.0.1:${LLAMA_PORT:-8080}:8080"
    volumes:
      - llm-models:/models:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 600s

  comfyui:
    build:
      context: ./infra/comfyui
    image: bricomission/comfyui:v0.45.3-rocm10.1.0
    profiles: ["ai"]
    restart: unless-stopped
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - "${RENDER_GID:-987}"
    ipc: host
    security_opt:
      - seccomp=unconfined
    environment:
      # Annotator weights come from the comfyui-annotators volume (filled by ai-fetch);
      # offline mode proves the demo never reaches Hugging Face at render time.
      AUX_ANNOTATOR_CKPTS_PATH: /opt/annotators
      HF_HUB_OFFLINE: "1"
    ports:
      - "127.0.0.1:${COMFYUI_PORT:-8188}:8188"
    volumes:
      - comfyui-models:/opt/ComfyUI/models
      - comfyui-annotators:/opt/annotators
      - comfyui-output:/opt/ComfyUI/output
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8188/system_stats"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 300s

  ai-fetch:
    # One-shot downloader; reuses the pinned llama.cpp image (Ubuntu, bash, curl).
    image: ghcr.io/ggml-org/llama.cpp:server-rocm-b12316
    profiles: ["ai-fetch"]
    restart: "no"
    entrypoint: ["bash", "/fetch/fetch-models.sh"]
    environment:
      FETCH_SD15: ${FETCH_SD15:-0}
    volumes:
      - ./infra/ai:/fetch:ro
      - llm-models:/models
      - comfyui-models:/comfy-models
      - comfyui-annotators:/annotators

  # --- Catalog RAG embedder (profile "rag"; ADR 0004) ---
  embedder:
    # CPU build of the same llama.cpp release as llama-server. CPU-only on purpose:
    # no devices, no group_add, -ngl 0, so it never competes for VRAM.
    # Digest (2026-11-13): sha256:2103d1f4f2e2e223ad80587dcb39fc15a9f912f29ae1fa9fc1193fe8c1aea82f
    image: ghcr.io/ggml-org/llama.cpp:server-b12316
    profiles: ["rag"]
    restart: unless-stopped
    command:
      - -m
      - /models/Qwen3-Embedding-0.6B-Q8_0.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --embeddings
      - --pooling
      - last
      - -ngl
      - "0"
      - -t
      - "${EMBEDDING_THREADS:-8}"
      - -c
      - "8192"
      - -b
      - "2048"
      - -ub
      - "2048"
    ports:
      - "127.0.0.1:${EMBEDDING_PORT:-8090}:8080"
    volumes:
      - embedding-models:/models:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 120s

  embedder-fetch:
    # One-shot downloader for the embedding GGUF (Ubuntu image with bash and curl).
    image: ghcr.io/ggml-org/llama.cpp:server-b12316
    profiles: ["rag-fetch"]
    restart: "no"
    entrypoint: ["bash", "/fetch/fetch-embedding-model.sh"]
    volumes:
      - ./infra/ai:/fetch:ro
      - embedding-models:/models

volumes:
  postgres-data:
  minio-data:
  mailpit-data:
  keycloak-data:
  # Model weights use fixed names so every checkout and worktree (any
  # COMPOSE_PROJECT_NAME) shares one copy instead of re-downloading ~30 GB.
  llm-models:
    name: bricomission_llm-models
  comfyui-models:
    name: bricomission_comfyui-models
  comfyui-annotators:
    name: bricomission_comfyui-annotators
  comfyui-output:
  embedding-models:
    name: bricomission_embedding-models
