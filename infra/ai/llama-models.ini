; llama-server router presets (feature simulations-ux-overhaul, spike A3).
; The router (compose service llama-server) lists these models, loads one on the first
; request with that "model" name and unloads it on POST /models/unload (GPU residency).
; Shared flags (-ngl, --n-cpu-moe, -c, -fa, --jinja, -t) come from the compose command.
version = 1

[qwen3-vl]
model = /models/Qwen3-VL-30B-A3B-Instruct-Q4_K_M.gguf
mmproj = /models/Qwen3-VL-30B-A3B-Instruct-mmproj-F16.gguf
