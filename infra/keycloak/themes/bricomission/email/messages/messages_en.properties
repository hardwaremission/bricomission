# BricoMission email theme, English (canonical copy from docs/design/keycloak-login-theme.md).
# Keycloak formats every value with java.text.MessageFormat: write an apostrophe as two ('').
# emailCodeSubject overrides the email-OTP provider subject; its only argument is the realm
# display name (the provider passes no code to the subject).
brandName=BricoMission
emailCodeSubject=Your {0} code
bmEmailGreeting=Hi {0},
bmEmailGreetingNoName=Hi,
bmEmailIntro=Use this code to confirm it''s you and continue in BricoMission:
bmEmailValidity=The code is valid for {0} minutes.
bmEmailIgnore=If you didn''t try to sign in or create an account, you can ignore this email. Your account stays safe.
