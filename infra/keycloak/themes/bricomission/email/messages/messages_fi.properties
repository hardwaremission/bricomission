# BricoMission email theme, Finnish. Agent translation of the English file (no native review; parity-tested).
# Keycloak formats every value with java.text.MessageFormat: write an apostrophe as two ('').
# emailCodeSubject overrides the email-OTP provider subject; its only argument is the realm
# display name (the provider passes no code to the subject).
brandName=BricoMission
emailCodeSubject={0}-koodisi
bmEmailGreeting=Hei {0},
bmEmailGreetingNoName=Hei,
bmEmailIntro=Vahvista henkilöllisyytesi tällä koodilla ja jatka BricoMissionissa:
bmEmailValidity=Koodi on voimassa {0} minuuttia.
bmEmailIgnore=Jos et yrittänyt kirjautua sisään tai luoda tiliä, voit jättää tämän sähköpostin huomiotta. Tilisi on edelleen turvassa.
