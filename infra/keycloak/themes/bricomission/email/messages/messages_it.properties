# BricoMission email theme, Italian. Agent translation of the English file (no native review; parity-tested).
# Keycloak formats every value with java.text.MessageFormat: write an apostrophe as two ('').
# emailCodeSubject overrides the email-OTP provider subject; its only argument is the realm
# display name (the provider passes no code to the subject).
brandName=BricoMission
emailCodeSubject=Il tuo codice {0}
bmEmailGreeting=Ciao {0},
bmEmailGreetingNoName=Ciao,
bmEmailIntro=Usa questo codice per confermare che sei tu e continuare su BricoMission:
bmEmailValidity=Il codice è valido per {0} minuti.
bmEmailIgnore=Se non hai provato ad accedere o a creare un account, puoi ignorare questa email. Il tuo account resta al sicuro.
