# BricoMission email theme, Danish. Agent translation of the English file (no native review; parity-tested).
# Keycloak formats every value with java.text.MessageFormat: write an apostrophe as two ('').
# emailCodeSubject overrides the email-OTP provider subject; its only argument is the realm
# display name (the provider passes no code to the subject).
brandName=BricoMission
emailCodeSubject=Din {0}-kode
bmEmailGreeting=Hej {0}
bmEmailGreetingNoName=Hej
bmEmailIntro=Brug denne kode til at bekræfte, at det er dig, og fortsæt i BricoMission:
bmEmailValidity=Koden er gyldig i {0} minutter.
bmEmailIgnore=Hvis du ikke har forsøgt at logge ind eller oprette en konto, kan du se bort fra denne e-mail. Din konto er stadig sikker.
