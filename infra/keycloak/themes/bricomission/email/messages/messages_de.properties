# BricoMission email theme, German. Agent translation of the English file (no native review; parity-tested).
# Keycloak formats every value with java.text.MessageFormat: write an apostrophe as two ('').
# emailCodeSubject overrides the email-OTP provider subject; its only argument is the realm
# display name (the provider passes no code to the subject).
brandName=BricoMission
emailCodeSubject=Dein {0}-Code
bmEmailGreeting=Hallo {0},
bmEmailGreetingNoName=Hallo,
bmEmailIntro=Mit diesem Code bestätigst du, dass du es bist, und machst in BricoMission weiter:
bmEmailValidity=Der Code ist {0} Minuten gültig.
bmEmailIgnore=Wenn du nicht versucht hast, dich anzumelden oder ein Konto zu erstellen, kannst du diese E-Mail ignorieren. Dein Konto bleibt sicher.
