# BricoMission email theme, Spanish. Agent translation of the English file (no native review; parity-tested).
# Keycloak formats every value with java.text.MessageFormat: write an apostrophe as two ('').
# emailCodeSubject overrides the email-OTP provider subject; its only argument is the realm
# display name (the provider passes no code to the subject).
brandName=BricoMission
emailCodeSubject=Tu código de {0}
bmEmailGreeting=Hola, {0}:
bmEmailGreetingNoName=Hola:
bmEmailIntro=Usa este código para confirmar que eres tú y continuar en BricoMission:
bmEmailValidity=El código es válido durante {0} minutos.
bmEmailIgnore=Si no has intentado iniciar sesión ni crear una cuenta, puedes ignorar este email. Tu cuenta sigue segura.
