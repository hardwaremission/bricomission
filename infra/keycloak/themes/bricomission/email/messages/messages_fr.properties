# BricoMission email theme, French. Agent translation of the English file (no native review; parity-tested).
# Keycloak formats every value with java.text.MessageFormat: write an apostrophe as two ('').
# emailCodeSubject overrides the email-OTP provider subject; its only argument is the realm
# display name (the provider passes no code to the subject).
brandName=BricoMission
emailCodeSubject=Votre code {0}
bmEmailGreeting=Bonjour {0},
bmEmailGreetingNoName=Bonjour,
bmEmailIntro=Utilisez ce code pour confirmer que c''est bien vous et continuer sur BricoMission :
bmEmailValidity=Le code est valable {0} minutes.
bmEmailIgnore=Si vous n''avez pas essayé de vous connecter ou de créer un compte, vous pouvez ignorer cet e-mail. Votre compte reste en sécurité.
