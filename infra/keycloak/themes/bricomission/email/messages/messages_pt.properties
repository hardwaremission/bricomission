# BricoMission email theme, Portuguese (European). Agent translation of the English file (no native review; parity-tested).
# Keycloak formats every value with java.text.MessageFormat: write an apostrophe as two ('').
# emailCodeSubject overrides the email-OTP provider subject; its only argument is the realm
# display name (the provider passes no code to the subject).
brandName=BricoMission
emailCodeSubject=O seu código {0}
bmEmailGreeting=Olá {0},
bmEmailGreetingNoName=Olá,
bmEmailIntro=Use este código para confirmar que é você e continuar na BricoMission:
bmEmailValidity=O código é válido durante {0} minutos.
bmEmailIgnore=Se não tentou iniciar sessão nem criar uma conta, pode ignorar este email. A sua conta continua segura.
