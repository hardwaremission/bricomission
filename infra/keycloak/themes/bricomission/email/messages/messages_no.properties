# BricoMission email theme, Norwegian (Bokmål). Agent translation of the English file (no native review; parity-tested).
# Keycloak formats every value with java.text.MessageFormat: write an apostrophe as two ('').
# emailCodeSubject overrides the email-OTP provider subject; its only argument is the realm
# display name (the provider passes no code to the subject).
brandName=BricoMission
emailCodeSubject=Din {0}-kode
bmEmailGreeting=Hei {0},
bmEmailGreetingNoName=Hei,
bmEmailIntro=Bruk denne koden for å bekrefte at det er deg og fortsette i BricoMission:
bmEmailValidity=Koden er gyldig i {0} minutter.
bmEmailIgnore=Hvis du ikke har prøvd å logge inn eller opprette en konto, kan du se bort fra denne e-posten. Kontoen din er fortsatt trygg.
