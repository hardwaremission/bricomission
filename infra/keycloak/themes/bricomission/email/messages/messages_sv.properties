# BricoMission email theme, Swedish. Agent translation of the English file (no native review; parity-tested).
# Keycloak formats every value with java.text.MessageFormat: write an apostrophe as two ('').
# emailCodeSubject overrides the email-OTP provider subject; its only argument is the realm
# display name (the provider passes no code to the subject).
brandName=BricoMission
emailCodeSubject=Din {0}-kod
bmEmailGreeting=Hej {0},
bmEmailGreetingNoName=Hej,
bmEmailIntro=Använd den här koden för att bekräfta att det är du och fortsätta i BricoMission:
bmEmailValidity=Koden är giltig i {0} minuter.
bmEmailIgnore=Om du inte har försökt logga in eller skapa ett konto kan du ignorera det här e-postmeddelandet. Ditt konto är fortfarande säkert.
