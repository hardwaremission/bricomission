# BricoMission email theme, Dutch. Agent translation of the English file (no native review; parity-tested).
# Keycloak formats every value with java.text.MessageFormat: write an apostrophe as two ('').
# emailCodeSubject overrides the email-OTP provider subject; its only argument is the realm
# display name (the provider passes no code to the subject).
brandName=BricoMission
emailCodeSubject=Je {0}-code
bmEmailGreeting=Hoi {0},
bmEmailGreetingNoName=Hoi,
bmEmailIntro=Gebruik deze code om te bevestigen dat jij het bent en verder te gaan in BricoMission:
bmEmailValidity=De code is {0} minuten geldig.
bmEmailIgnore=Heb je niet geprobeerd in te loggen of een account aan te maken? Dan kun je deze e-mail negeren. Je account blijft veilig.
