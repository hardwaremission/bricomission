# BricoMission login theme (feature keycloak-login-theme).
# Extends `base` (not keycloak.v2): layout and CSS come only from the approved OpenPencil
# design (docs/design/keycloak-login-theme.md). Overridden templates: template.ftl,
# login.ftl, register.ftl, email-code-form.ftl (provider keycloak-2fa-email-authenticator),
# error.ftl, info.ftl, login-page-expired.ftl. Every other page falls back to base markup
# with the kc*Class mappings below.
parent=base
locales=en,es,fr,de,it,pt,nl,sv,no,da,fi
styles=css/bricomission.css

kcHtmlClass=bm-html
kcBodyClass=bm-body
kcLoginClass=bm-page
kcFormCardClass=bm-content
kcFormClass=bm-form
kcFormGroupClass=bm-generic-group
kcLabelClass=bm-label
kcLabelWrapperClass=
kcInputWrapperClass=
kcInputClass=bm-generic-input
kcInputGroup=bm-input-row
kcInputErrorMessageClass=bm-field-error
kcButtonClass=bm-button
kcButtonPrimaryClass=bm-button--primary
kcButtonDefaultClass=bm-button--secondary
kcButtonBlockClass=
kcButtonLargeClass=
kcFormButtonsClass=bm-form
kcFormButtonsWrapperClass=bm-form
kcFormOptionsClass=bm-links
kcFormOptionsWrapperClass=bm-links
kcAlertClass=bm-alert
kcAlertTitleClass=bm-alert__text
kcSignUpClass=bm-links
