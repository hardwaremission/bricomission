<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BricoMission — Animación Wordmark Completo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-canvas: #ffffff;
      --grid-minor: rgba(25, 33, 49, 0.03);
      --grid-major: rgba(25, 33, 49, 0.07);
      --ink-primary: #192131;
      --ink-accent: #2868e8;
      --guide-line: rgba(40, 104, 232, 0.28);
      --ui-surface: rgba(248, 250, 252, 0.92);
      --ui-border: rgba(25, 33, 49, 0.12);
      --ui-text: #192131;
      --ui-muted: #64748b;
    }

    body.dark-mode {
      --bg-canvas: #0b1120;
      --grid-minor: rgba(248, 250, 252, 0.03);
      --grid-major: rgba(248, 250, 252, 0.07);
      --ink-primary: #f8fafc;
      --ink-accent: #3b82f6;
      --guide-line: rgba(59, 130, 246, 0.35);
      --ui-surface: rgba(30, 41, 59, 0.85);
      --ui-border: rgba(248, 250, 252, 0.14);
      --ui-text: #f8fafc;
      --ui-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-canvas);
      color: var(--ui-text);
      transition: background-color 0.45s cubic-bezier(0.16, 1, 0.3, 1), color 0.45s ease;
      overflow-x: hidden;
    }

    /* Retícula de mesa de dibujo técnico */
    .blueprint-grid {
      background-image:
        linear-gradient(to right, var(--grid-major) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-major) 1px, transparent 1px),
        linear-gradient(to right, var(--grid-minor) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-minor) 1px, transparent 1px);
      background-size: 96px 96px, 96px 96px, 24px 24px, 24px 24px;
      background-position: center center;
    }

    .svg-ink-fill {
      fill: var(--ink-primary);
      transition: fill 0.45s ease;
    }

    .svg-accent-fill {
      fill: var(--ink-accent);
      transition: fill 0.45s ease;
    }

    .svg-dim-stroke {
      stroke: var(--ink-primary);
      transition: stroke 0.45s ease;
    }

    /* Líneas de replanteo tipográfico (efímeras durante la construcción) */
    .construction-guide {
      stroke: var(--guide-line);
      stroke-width: 1.8;
      stroke-dasharray: 2600;
      stroke-dashoffset: 2600;
      opacity: 0;
    }

    /* Cotas permanentes */
    .dim-line {
      stroke-dasharray: var(--len, 2500);
      stroke-dashoffset: var(--len, 2500);
    }

    .dim-tick {
      stroke-dasharray: 60;
      stroke-dashoffset: 60;
    }

    /* Piezas tipográficas */
    .glyph-piece {
      opacity: 0;
      transform-box: fill-box;
      will-change: transform, opacity;
    }

    /* Keyframes de replanteo y cotas */
    @keyframes guideSweep {
      0% {
        stroke-dashoffset: 2600;
        opacity: 0.9;
      }
      55% {
        stroke-dashoffset: 0;
        opacity: 0.85;
      }
      100% {
        stroke-dashoffset: 0;
        opacity: 0;
      }
    }

    @keyframes drawStroke {
      0% {
        stroke-dashoffset: var(--len, 2500);
        opacity: 0.25;
      }
      100% {
        stroke-dashoffset: 0;
        opacity: 1;
      }
    }

    @keyframes drawTick {
      0% {
        stroke-dashoffset: 60;
        opacity: 0;
      }
      100% {
        stroke-dashoffset: 0;
        opacity: 1;
      }
    }

    /* Keyframes de ensamblaje arquitectónico por tipo de trazo */
    @keyframes stemRise {
      0% {
        opacity: 0;
        transform: translateY(46px) scaleY(0.88);
      }
      72% {
        opacity: 1;
        transform: translateY(-3px) scaleY(1.01);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scaleY(1);
      }
    }

    @keyframes stemDrop {
      0% {
        opacity: 0;
        transform: translateY(-46px) scaleY(0.88);
      }
      72% {
        opacity: 1;
        transform: translateY(3px) scaleY(1.01);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scaleY(1);
      }
    }

    @keyframes moduleSlideRight {
      0% {
        opacity: 0;
        transform: translateX(-36px) scaleX(0.94);
      }
      74% {
        opacity: 1;
        transform: translateX(3px) scaleX(1.01);
      }
      100% {
        opacity: 1;
        transform: translateX(0) scaleX(1);
      }
    }

    @keyframes moduleUnfold {
      0% {
        opacity: 0;
        transform: translateY(28px) scale(0.9);
        transform-origin: center center;
      }
      72% {
        opacity: 1;
        transform: translateY(-2px) scale(1.02);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes diagSlashDown {
      0% {
        opacity: 0;
        transform: translate(-30px, -58px);
      }
      75% {
        opacity: 1;
        transform: translate(2px, 3px);
      }
      100% {
        opacity: 1;
        transform: translate(0, 0);
      }
    }

    @keyframes diagSlashUp {
      0% {
        opacity: 0;
        transform: translate(-30px, 58px);
      }
      75% {
        opacity: 1;
        transform: translate(2px, -3px);
      }
      100% {
        opacity: 1;
        transform: translate(0, 0);
      }
    }

    @keyframes dotBounce {
      0% {
        opacity: 0;
        transform: translateY(-44px) scale(0.5);
        transform-origin: center center;
      }
      60% {
        opacity: 1;
        transform: translateY(4px) scale(1.08);
      }
      82% {
        transform: translateY(-2px) scale(0.97);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes cornerKeystone {
      0% {
        opacity: 0;
        transform: translate(-22px, -22px) scale(0.8);
      }
      68% {
        opacity: 1;
        transform: translate(2px, 2px) scale(1.04);
      }
      100% {
        opacity: 1;
        transform: translate(0, 0) scale(1);
      }
    }

    @keyframes pulseBeacon {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.45;
        transform: scale(0.85);
      }
    }

    /* Activación de la secuencia */
    .is-playing .construction-guide {
      animation: guideSweep 1.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      animation-delay: var(--d, 0s);
    }

    .is-playing .dim-main {
      animation: drawStroke 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      animation-delay: var(--d, 0.1s);
    }

    .is-playing .dim-ext {
      animation: drawStroke 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      animation-delay: var(--d, 0.3s);
    }

    .is-playing .dim-tick {
      animation: drawTick 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      animation-delay: var(--d, 0.5s);
    }

    .is-playing .anim-rise {
      animation: stemRise 0.56s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: var(--d, 0.6s);
    }

    .is-playing .anim-drop {
      animation: stemDrop 0.56s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: var(--d, 0.6s);
    }

    .is-playing .anim-slide {
      animation: moduleSlideRight 0.64s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: var(--d, 0.65s);
    }

    .is-playing .anim-unfold {
      animation: moduleUnfold 0.58s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: var(--d, 0.7s);
    }

    .is-playing .anim-diag-down {
      animation: diagSlashDown 0.58s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: var(--d, 1.05s);
    }

    .is-playing .anim-diag-up {
      animation: diagSlashUp 0.58s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: var(--d, 1.15s);
    }

    .is-playing .anim-dot {
      animation: dotBounce 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: var(--d, 0.9s);
    }

    .is-playing .anim-corner {
      animation: cornerKeystone 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: var(--d, 1.85s);
    }

    .is-paused * {
      animation-play-state: paused !important;
    }

    .mono-tag {
      font-family: 'JetBrains Mono', monospace;
    }

    .control-bar {
      background: var(--ui-surface);
      border: 1px solid var(--ui-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
  </style>
</head>

        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

          <path d="M3 3v5h5" />
        </svg>
        <span>Repetir</span>
      </button>

      <button id="btn-pause" type="button" class="px-4 py-2.5 rounded-xl hover:bg-black/5 dark:hover:bg-white/10 active:scale-95 text-sm font-medium flex items-center gap-2 transition cursor-pointer">
        <svg id="icon-pause" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="6" y="4" width="4" height="16" />
          <rect x="14" y="4" width="4" height="16" />
        </svg>
        <span id="text-pause">Pausar</span>
      </button>

      <div class="h-5 w-px bg-current opacity-15 mx-1"></div>

      <button id="btn-theme" type="button" class="px-3.5 py-2.5 rounded-xl hover:bg-black/5 dark:hover:bg-white/10 active:scale-95 text-sm font-medium flex items-center gap-2 transition cursor-pointer" title="Alternar tema claro/oscuro">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
        </svg>
        <span id="text-theme" class="hidden sm:inline">Modo oscuro</span>
      </button>
    </div>
  </footer>

  <script>
    (function () {
      const stage = document.getElementById('wm-stage');
      const btnReplay = document.getElementById('btn-replay');
      const btnPause = document.getElementById('btn-pause');
      const textPause = document.getElementById('text-pause');
      const iconPause = document.getElementById('icon-pause');
      const btnTheme = document.getElementById('btn-theme');
      const textTheme = document.getElementById('text-theme');
      const statusLabel = document.getElementById('status-label');

      let isPaused = false;
      let t1 = null;
      let t2 = null;
      let t3 = null;

      function startAnimation() {
        isPaused = false;
        stage.classList.remove('is-playing', 'is-paused');
        textPause.textContent = 'Pausar';
        iconPause.innerHTML = '<rect x="6" y="4" width="4" height="16" /><rect x="14" y="4" width="4" height="16" />';
        statusLabel.textContent = 'REPLANTEANDO EJES Y COTAS...';

        void stage.getBoundingClientRect();
        stage.classList.add('is-playing');

        clearTimeout(t1);
        clearTimeout(t2);
        clearTimeout(t3);

        t1 = setTimeout(() => {
          if (!isPaused) statusLabel.textContent = 'CONSTRUYENDO TIPOGRAFÍA...';
        }, 550);

        t2 = setTimeout(() => {
          if (!isPaused) statusLabel.textContent = 'SELLANDO ESQUINAS AZULES...';
        }, 1800);

        t3 = setTimeout(() => {
          if (!isPaused) statusLabel.textContent = 'LOGOTIPO COMPLETADO';
        }, 2550);
      }

      btnReplay.addEventListener('click', startAnimation);

      btnPause.addEventListener('click', () => {
        isPaused = !isPaused;
        if (isPaused) {
          stage.classList.add('is-paused');
          textPause.textContent = 'Reanudar';
          iconPause.innerHTML = '<polygon points="5 3 19 12 5 21 5 3" />';
          statusLabel.textContent = 'EN PAUSA';
        } else {
          stage.classList.remove('is-paused');
          textPause.textContent = 'Pausar';
          iconPause.innerHTML = '<rect x="6" y="4" width="4" height="16" /><rect x="14" y="4" width="4" height="16" />';
          statusLabel.textContent = 'REANUDADO';
        }
      });

      btnTheme.addEventListener('click', () => {
        const dark = document.body.classList.toggle('dark-mode');
        textTheme.textContent = dark ? 'Modo claro' : 'Modo oscuro';
      });

      window.addEventListener('load', () => {
        requestAnimationFrame(startAnimation);
      });
    })();
  </script>
